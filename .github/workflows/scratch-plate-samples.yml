name: scratch plate check
# temporary, working branch only: removed before merge. prints the minimums tables behind the
# history lines that now name a row, to check them by hand
on:
  push:
    branches: [ claude/project-thread-oqn9y9 ]
    paths: [ ".github/workflows/scratch-plate-samples.yml" ]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf==6.19.0
      - run: |
          python - <<'PY'
          import io, re, pypdf
          from amend import plates
          for ed, pdf, alt in (("2609", "06072R35.PDF", "884"), ("2611", "05771R19.PDF", "999"),
                               ("2610", "05771R19.PDF", "999"), ("2611", "00089R23.PDF", "740")):
              b = plates._get(plates.URL.format(edition=ed, pdf=pdf))
              if b is None:
                  print("=====", ed, pdf, "not served"); continue
              page = pypdf.PdfReader(io.BytesIO(b)).pages[0]
              text, ch = plates._chunks(page)
              print("=====", ed, pdf, plates.minimums(text))
              for m in re.finditer(alt, text):
                  print("  TEXT", repr(text[max(0, m.start() - 40):m.end() + 60]))
              ys = [y for x, y, t in ch if alt in t]
              for x, y, t in sorted(ch, key=lambda c: (-c[1], c[0])):
                  if any(abs(y - y0) < 9 for y0 in ys):
                      print(f"  {x:6.1f} {y:6.1f} {t!r}")
          PY
