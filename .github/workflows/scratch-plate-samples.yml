name: scratch plate backfill
# temporary, working branch only: removed before merge. reads the plates for the editions the
# FAA still serves and commits plates/ to this branch
on:
  push:
    branches: [ claude/project-thread-oqn9y9 ]
    paths: [ ".github/workflows/scratch-plate-samples.yml" ]
permissions:
  contents: write
jobs:
  plates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf==6.19.0
      - run: |
          mkdir -p meta
          for e in 2608 2609 2610 2611; do
            curl -sSfL -o meta/$e.xml https://aeronav.faa.gov/d-tpp/$e/xml_data/d-tpp_Metafile.xml
          done
          python -m amend plates meta/2608.xml meta/2609.xml meta/2610.xml meta/2611.xml --budget 1500
          ls -la plates
      - if: ${{ !cancelled() }}
        run: |
          git config user.name "amend-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plates && git commit -qm "plates: courses on every chart changed in the 2608-2611 editions" && git push
