name: scratch plate backfill
# temporary, working branch only: removed before merge. reads the plates for the editions the
# FAA still serves again, now noting visibilities with a fraction drawn beside them, and commits plates/ to this branch
on:
  push:
    branches: [ claude/project-thread-oqn9y9 ]
    paths: [ ".github/workflows/scratch-plate-samples.yml" ]
permissions:
  contents: write
jobs:
  plates:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf==6.19.0
      - run: |
          cp -r plates /tmp/before
          mkdir -p meta
          for e in 2607 2608 2609 2610 2611 2612; do
            curl -sSfL -o meta/$e.xml https://aeronav.faa.gov/d-tpp/$e/xml_data/d-tpp_Metafile.xml \
              && echo "edition $e served" || { echo "edition $e not served"; rm -f meta/$e.xml; }
          done
          python -m amend plates meta/*.xml --budget 3000
      - name: the numbers read before are unchanged; only split fractions are new
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import json, glob, os, collections
          n, same, diff, split = 0, 0, [], []
          for p in sorted(glob.glob("plates/*.json")):
              before = json.load(open("/tmp/before/" + os.path.basename(p)))["charts"]
              for pdf, rec in json.load(open(p))["charts"].items():
                  old = before.get(pdf)
                  m, o = (rec or {}).get("minimums"), (old or {}).get("minimums")
                  if not isinstance(m, dict) or not isinstance(o, dict):
                      continue
                  n += 1
                  s = set(m.get("split") or [])
                  if s:
                      split.append((pdf, sorted(s), o.get("vis"), m.get("vis")))
                  ov = {a: v for a, v in (o.get("vis") or {}).items() if a not in s}
                  if all(m.get(k) == o.get(k) for k in ("alts", "rvr", "seen", "rows")) and ov == {a: v for a, v in (m.get("vis") or {}).items() if a not in s}:
                      same += 1
                  else:
                      diff.append(pdf)
          print(f"{n} plates with minimums before and after; {same} same apart from split fractions; differ: {diff[:20]}")
          print(f"{len(split)} plates with a split fraction")
          for x in split[:60]:
              print(*x)
          PY
      - if: ${{ !cancelled() }}
        run: |
          git config user.name "amend-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plates
          git diff --cached --quiet || { git commit -qm "plates: note visibilities whose fraction is drawn beside them, for the editions the FAA still serves" && git push; }
