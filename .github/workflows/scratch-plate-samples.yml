name: scratch plate check
# temporary, working branch only: removed before merge. prints courses on a few plates per edition
on:
  push:
    branches: [ claude/project-thread-oqn9y9 ]
    paths: [ ".github/workflows/scratch-plate-samples.yml" ]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf==6.19.0
      - run: |
          python - <<'PY'
          from amend import plates
          for pdf in ("00110AD.PDF", "00110IL7L.PDF", "00110R7L.PDF", "00110ROYES.PDF"):
              for ed in ("2607", "2608", "2609", "2610", "2611"):
                  b = plates._get(plates.URL.format(edition=ed, pdf=pdf))
                  print(ed, pdf, None if b is None else plates.read(b)["courses"])
          PY
