name: scratch plate check
# temporary, working branch only: removed before merge. prints the minimums table text of a few plates
on:
  push:
    branches: [ claude/project-thread-oqn9y9 ]
    paths: [ ".github/workflows/scratch-plate-samples.yml" ]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf==6.19.0
      - run: |
          python - <<'PY'
          import io, pypdf
          from amend import plates
          pdfs = ['00875VD13.PDF', '00432R36L.PDF', '05551R2.PDF', '06870R29.PDF', '00188R31.PDF',
                  '00020IL34.PDF', '06791R20.PDF', '00912V35.PDF', '00859R18.PDF', '06894IYLY23.PDF',
                  '05818R26.PDF', '00548IL2.PDF']
          for pdf in pdfs:
              b = plates._get(plates.URL.format(edition="2611", pdf=pdf))
              page = pypdf.PdfReader(io.BytesIO(b)).pages[0]
              text, ch = plates._chunks(page)
              heads = [(x, y) for x, y, t in ch if t.strip().startswith("CATEGORY")]
              print(f"===== {pdf} heads {heads}")
              if heads:
                  hx, hy = heads[0]
                  for x, y, t in sorted(ch, key=lambda c: (-c[1], c[0])):
                      if hy - 200 < y < hy + 3:
                          print(f"  {x:6.1f} {y:6.1f} {t!r}")
              print("ROWS", plates.rows(ch))
              print("MINS", plates.minimums(text)["alts"])
          PY
