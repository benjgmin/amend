name: scratch plate check
# temporary, working branch only: removed before merge. prints the minimums lines of a few plates
on:
  push:
    branches: [ claude/project-thread-oqn9y9 ]
    paths: [ ".github/workflows/scratch-plate-samples.yml" ]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf==6.19.0
      - run: |
          python - <<'PY'
          import io, pypdf
          from amend import plates
          checks = {"00142RX16R.PDF": ("836", "826"), "06072R35.PDF": ("508", "560", "884"),
                    "05344R1.PDF": ("1044", "1043"), "06703R16.PDF": ("3460", "3280"),
                    "00001R35R.PDF": ("2300", "2240"), "06943R31.PDF": ("3360", "3231"),
                    "01231R28.PDF": ("275", "225"), "05216R21.PDF": ("1261", "1268")}
          for pdf, vals in checks.items():
              for ed in ("2608", "2609"):
                  b = plates._get(plates.URL.format(edition=ed, pdf=pdf))
                  lines = "\n".join(p.extract_text() or "" for p in pypdf.PdfReader(io.BytesIO(b)).pages).split("\n")
                  hits = [" | ".join(lines[max(0, i - 1):i + 2]) for i, l in enumerate(lines) if any(v in l for v in vals)]
                  print(ed, pdf, hits[:6])
          PY
