name: scratch plate check
# temporary, working branch only: removed before merge. prints the minimums tables behind the
# history lines that now name a row, to check them by hand
on:
  push:
    branches: [ claude/project-thread-oqn9y9 ]
    paths: [ ".github/workflows/scratch-plate-samples.yml" ]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf==6.19.0
      - run: |
          python - <<'PY'
          import io, pypdf
          from amend import plates
          pdfs = ['00095IL35.PDF', '00095VA.PDF', '00142RX16R.PDF', '00286R6.PDF', '00286VA.PDF',
                  '00632IL1.PDF', '00858VB.PDF', '01231IZLZ28.PDF', '01234IL2L.PDF', '05103IL9.PDF',
                  '05103R33.PDF', '05103R9.PDF', '05216R21.PDF', '05312R29.PDF', '05326R16L.PDF',
                  '05344R1.PDF', '05531R16.PDF', '05856R20.PDF', '05943R36.PDF', '06019R32.PDF',
                  '06072R35.PDF', '06172R17.PDF', '06657R35.PDF', '06866R18.PDF', '06866R36.PDF']
          for pdf in pdfs:
              b = plates._get(plates.URL.format(edition="2609", pdf=pdf))
              if b is None:
                  print("=====", pdf, "not served"); continue
              page = pypdf.PdfReader(io.BytesIO(b)).pages[0]
              print("=====", pdf, plates.read(b)["minimums"]["rows"])
              lines = page.extract_text(extraction_mode="layout").split("\n")
              i = next((n for n, l in enumerate(lines) if "CATEGORY" in l), None)
              if i is not None:
                  print("\n".join(l[:160].rstrip() for l in lines[i:i + 16] if l.strip()))
          PY
