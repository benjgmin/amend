name: update FAA changes

on:
  schedule:
    # every 10 minutes, off the hour (GitHub drops and delays scheduled runs, worst on the hour:
    # it fired 1 of 3 overnight at every-3-hours). each run starts with a ~2s check and only
    # rebuilds when the FAA posted something new, a merge isn't live yet, the cycle changed over,
    # or the last build is 20h old, so most runs end after the check. the site doesn't need a run
    # at 0901Z to switch cycles (the pages and app flip by the clock); the run after it catches
    # history up
    - cron: "3-59/10 * * * *"
  workflow_dispatch:           # "Run workflow" button in the Actions tab
    inputs:
      check_only:              # an outside scheduler can dispatch with check_only=true to get the
        description: "Only rebuild if the check says so (what scheduled runs do)"
        type: boolean          # same "anything new?" check as the cron, if GitHub's cron lags
        default: false
  push:                        # any merge that can change the site goes live right away.
    branches: [ master ]       # the bot's own data commits use GITHUB_TOKEN, which never
    paths-ignore:              # triggers a workflow, so this can't loop
      - "ios/**"
      - "docs/**"
      - "**.md"
      - "LICENSE"

permissions:
  contents: write              # to commit new history
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # merges and the Run workflow button always build; scheduled runs build only when needed
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.check_only }}" = "true" ]; then
            python -m amend check
          else
            echo "build: ${{ github.event_name }}"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # belt and braces: the diff used to pair rows in set order, which Python randomizes per
    # process (two runs on the same FAA files differed at ~20 of 10.7k airports, ids included).
    # it sorts now; a fixed seed keeps any set order that's left out of rebuilds, and the run
    # log records it (runlog.py hash_seed)
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install Pillow (link-preview images)
        run: pip install pillow

      - name: tests
        run: python -m unittest discover -s tests -t .

      # FAA downloads. restore the newest cache; save a new one only when data/ changed (below),
      # instead of 340MB per run. only files that passed cycles.check_file ever land in data/
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: faa-data-restore
          restore-keys: faa-data-

      # every diff (here and in the build) adds a record to the run log, one file per record
      # under audit/runs/<cycle>/ (amend/runlog.py): sources and checksums, rows read, changes,
      # checks, outcome. one file each, so a build queued behind another can't conflict with it
      - name: append new cycles to history
        id: history
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m amend history --llm

      # also runs the audit (amend/audit.py): a failed check stops here, so the last good
      # site stays up and the failure alert fires
      - name: build site (latest + history)
        id: build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m amend latest

      # any step failing stops here: nothing is deployed, and the last good site stays live
      # until a later run succeeds (the commit step below still records history and the audit)
      - name: check the site before it goes live
        run: python -m amend verify site

      # remark_cache.json is committed, not kept in the Actions cache: translations are paid for
      # once, never lost to cache eviction, and change ids (which hash the summary) stay stable.
      # so is remark_rejects.json, so a remark whose answer broke the checks isn't paid for again
      # every build.
      # also commits the audit packet the daily review reads (audit/<cycle>.json) and the run
      # log (audit/runs/), and runs when the history step or the build failed too, so a blocked
      # or crashed run is on record. history only ever holds audited cycles (history.py audits
      # before it appends). one step, so no file is left modified and unstaged when git pull
      # --rebase runs
      - name: commit history, remark translations, audit packet and run log
        if: ${{ !cancelled() && steps.history.outcome != 'skipped' }}
        run: |
          git config user.name "amend-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history remark_cache.json remark_rejects.json
          if [ -d audit ]; then git add audit; fi
          git diff --cached --quiet && exit 0
          git commit -m "data: history, remark translations, audit and run log"
          for i in 1 2 3; do     # a merge landing mid-run makes the first push bounce
            git pull --rebase origin "${{ github.ref_name }}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "couldn't push history; not deploying so the site never gets ahead of the repo"
          exit 1

      - name: trim old FAA files from cache
        run: |
          ls -t data/*_CSV.zip 2>/dev/null | tail -n +4 | xargs -r rm -f
          ls -t data/*_airspace.zip 2>/dev/null | tail -n +4 | xargs -r rm -f
          ls -t data/dtpp_*.xml 2>/dev/null | tail -n +4 | xargs -r rm -f
          rm -f data/*.part
          for m in data/*.json; do     # download records (cycles.meta_path) of trimmed files
            if [ -e "$m" ] && [ ! -e "${m%.json}" ]; then rm -f "$m"; fi
          done

      - uses: actions/cache/save@v4
        if: hashFiles('data/**') != ''
        with:
          path: data
          key: faa-data-${{ hashFiles('data/**') }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
