name: update FAA changes

on:
  schedule:
    - cron: "17 12 * * *"     # every day 12:17 UTC; off the hour, when GitHub drops scheduled runs
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:                        # any merge that can change the site goes live right away.
    branches: [ master ]       # the bot's own data commits use GITHUB_TOKEN, which never
    paths-ignore:              # triggers a workflow, so this can't loop
      - "ios/**"
      - "docs/**"
      - "**.md"
      - "LICENSE"

permissions:
  contents: write              # to commit new history
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install Pillow (link-preview images)
        run: pip install pillow

      - name: tests
        run: python -m unittest discover -s tests -t .

      # FAA downloads
      - uses: actions/cache@v4
        with:
          path: data
          key: faa-data-${{ github.run_id }}
          restore-keys: faa-data-

      - name: append new cycles to history
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m amend history --llm

      # also runs the audit (amend/audit.py): a failed check stops here, so the last good
      # site stays up and the failure alert fires
      - name: build site (latest + history)
        id: build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m amend latest

      # remark_cache.json is committed, not kept in the Actions cache: translations are paid for
      # once, never lost to cache eviction, and change ids (which hash the summary) stay stable.
      # also commits the audit packet the daily review reads (audit/<cycle>.json), and runs when
      # the build's audit failed too, so a blocked cycle's reasons are on record. one step, so
      # no file is left modified and unstaged when git pull --rebase runs
      - name: commit history, remark translations and audit packet
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        run: |
          git config user.name "amend-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history remark_cache.json
          if [ -d audit ]; then git add audit; fi
          git diff --cached --quiet || (git commit -m "data: new history / remark translations" \
            && git pull --rebase origin "${{ github.ref_name }}" && git push)

      - name: trim old FAA files from cache
        run: |
          ls -t data/*_CSV.zip 2>/dev/null | tail -n +4 | xargs -r rm -f
          ls -t data/*_airspace.zip 2>/dev/null | tail -n +4 | xargs -r rm -f

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
