name: update FAA changes

on:
  schedule:
    - cron: "17 12 * * *"     # every day 12:17 UTC; off the hour, when GitHub drops scheduled runs
  workflow_dispatch:           # "Run workflow" button in the Actions tab

permissions:
  contents: write              # to commit new history
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: tests
        run: python -m unittest discover -s tests -t .

      # FAA downloads
      - uses: actions/cache@v4
        with:
          path: data
          key: faa-data-${{ github.run_id }}
          restore-keys: faa-data-

      - name: append new cycles to history
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m amend history --llm

      - name: build site (latest + history)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m amend latest

      # remark_cache.json is committed, not kept in the Actions cache: translations are paid for
      # once, never lost to cache eviction, and change ids (which hash the summary) stay stable
      - name: commit history and remark translations
        run: |
          git config user.name "amend-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history remark_cache.json
          git diff --cached --quiet || (git commit -m "data: new history / remark translations" \
            && git pull --rebase origin "${{ github.ref_name }}" && git push)

      - name: trim old FAA files from cache
        run: ls -t data/*_CSV.zip 2>/dev/null | tail -n +4 | xargs -r rm -f

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
