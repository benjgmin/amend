# TEMPORARY: back up the remaining d-TPP cycles the FAA still serves, then run again to prove
# a second run is a no-op. removed right after.
name: archive at-risk cycles (temporary)
on:
  push:
    branches: [ claude/raw-faa-archive-011adq ]
permissions:
  contents: write
concurrency:
  group: archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_archive
      - name: archive 2026-09-03, 2026-10-01, 2026-10-29
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python -m amend archive 2026-09-03 2026-10-01 2026-10-29 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: run again over all five, must be a no-op
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python -m amend archive 2026-07-09 2026-08-06 2026-09-03 2026-10-01 2026-10-29 | tee -a "$GITHUB_STEP_SUMMARY"
