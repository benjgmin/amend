# TEMPORARY: availability probe for the raw archive PR. removed before the PR is ready.
name: probe FAA archive (temporary)
on:
  push:
    branches: [ claude/raw-faa-archive-011adq ]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: raw probe, 2022 onward
        run: |
          set -o pipefail
          python .github/probe/probe.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: the real archive --list
        run: |
          set -o pipefail
          python -m amend archive --list --backfill | tee -a "$GITHUB_STEP_SUMMARY"
