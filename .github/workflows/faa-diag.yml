# TEMPORARY: read-only diagnostic for reviewing PRs #18-#20. runs only on this review branch,
# never deploys or writes (contents: read, no secrets). builds the real site with each PR's code
# from the FAA cache, then measures it and runs verify (and #19's audit).
name: faa diagnostic (temporary)

on:
  push:
    branches: [ claude/project-thread-rymn8h ]
    paths: [ ".github/workflows/faa-diag.yml" ]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: master
            ref: master
            merge: ""
          - name: pr19-audit
            ref: claude/release-audit-2mgf1y
            merge: ""
          - name: pr20-feeds
            ref: claude/rss-email-alerts-n00jtw
            merge: ""
          - name: pr19+pr20
            ref: claude/release-audit-2mgf1y
            merge: claude/rss-email-alerts-n00jtw
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - name: merge the other PR
        if: matrix.merge != ''
        run: |
          git -c user.name=diag -c user.email=diag@example.com merge --no-edit "origin/${{ matrix.merge }}"
          git log --oneline -3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: faa-data-restore
          restore-keys: faa-data-
      - name: what's in the cache
        run: ls -la data || true
      - name: history (no llm, should be up to date)
        run: python -m amend history
      - name: build site (no llm)
        id: build
        run: |
          start=$(date +%s)
          python -m amend latest --no-llm
          echo "latest took $(( $(date +%s) - start ))s"
      - name: audit result (pr19)
        if: always()
        run: |
          ls audit 2>/dev/null || { echo "no audit dir"; exit 0; }
          python - <<'PY'
          import glob, json
          for p in sorted(glob.glob("audit/*.json")):
              d = json.load(open(p))
              print(p, d["from_cycle"], "->", d["to_cycle"], len(d["errors"]), "errors", len(d["warnings"]), "warnings",
                    sum(len(v) for v in d["airports"].values()), "review items at", len(d["airports"]), "airports")
              for x in d["errors"][:40]: print("  ERROR", x)
              for x in d["warnings"][:40]: print("  warn ", x)
          PY
      - name: verify
        if: always() && steps.build.outcome == 'success'
        run: python -m amend verify site
      - name: measure the site
        if: always() && steps.build.outcome == 'success'
        run: |
          echo "files: $(find site -type f | wc -l)  dirs: $(find site -type d | wc -l)"
          du -sh site; du -sh --apparent-size site
          echo "feeds: $(find site -name feed.xml | wc -l)"
          find site -name feed.xml -print0 | du -ch --apparent-size --files0-from=- | tail -1
          echo "dirs with only feed.xml (no page): $(for d in site/*/; do [ -f "$d/feed.xml" ] && [ ! -f "$d/index.html" ] && echo x; done | wc -l)"
          python -c "import json; print('directory airports:', len(json.load(open('site/airports.json'))['airports']))"
          tar -cf /tmp/site.tar -C site . && ls -l /tmp/site.tar | awk '{print "tar bytes:", $5}'
          gzip -c /tmp/site.tar | wc -c | awk '{print "gzip bytes:", $1}'
          find site -name feed.xml -printf '%s %p\n' | sort -n | tail -3
      - name: check every feed parses
        if: always() && steps.build.outcome == 'success'
        run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET, re
          bad, n, items, guids = [], 0, 0, {}
          ctrl = re.compile(rb"[\x00-\x08\x0b\x0c\x0e-\x1f]")
          for p in glob.glob("site/**/feed.xml", recursive=True):
              n += 1
              raw = open(p, "rb").read()
              if ctrl.search(raw): bad.append((p, "control char"))
              try:
                  root = ET.fromstring(raw)
              except ET.ParseError as e:
                  bad.append((p, str(e))); continue
              for it in root.iter("item"):
                  items += 1
                  g = it.findtext("guid")
                  if g in guids: bad.append((p, f"dup guid {g} also in {guids[g]}"))
                  guids[g] = p
          print(f"{n} feeds, {items} items, {len(bad)} problems")
          for b in bad[:30]: print("  ", b)
          PY
