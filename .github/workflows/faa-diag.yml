# TEMPORARY: read-only diagnostic for reviewing PR #18. runs only on this review branch, never
# deploys or writes. checks what nfdc/aeronav return for posted and not-yet-posted files (Range
# support, 404 vs HTML vs 5xx) and whether cycles.check_file accepts real FAA files.
name: faa diagnostic (temporary)

on:
  push:
    branches: [ claude/project-thread-rymn8h ]
    paths: [ ".github/workflows/faa-diag.yml" ]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: raw responses and probe()
        run: |
          python - <<'PY'
          import datetime as dt, urllib.request, urllib.error, time
          from amend import cycles as c
          D = dt.date
          urls = {
            "csv 10-29 (next-next)": c.csv_url(D(2026,10,29)),
            "csv 11-26": c.csv_url(D(2026,11,26)),
            "csv 10-01 (next)": c.csv_url(D(2026,10,1)),
            "air 10-29": c.airspace_url(D(2026,10,29)),
            "air 11-26": c.airspace_url(D(2026,11,26)),
            "air 10-01": c.airspace_url(D(2026,10,1)),
            "air 09-03": c.airspace_url(D(2026,9,3)),
            "air 08-06": c.airspace_url(D(2026,8,6)),
            "air 2024-09-05": c.airspace_url(D(2024,9,5)),
            "dtpp 2611": c.dtpp_url(D(2026,10,29)),
            "dtpp 2612": c.dtpp_url(D(2026,11,26)),
            "dtpp 2610": c.dtpp_url(D(2026,10,1)),
            "dtpp 2609": c.dtpp_url(D(2026,9,3)),
            "dtpp 2608": c.dtpp_url(D(2026,8,6)),
          }
          def show(label, url, rng):
              h = {"User-Agent": "amend"}
              if rng: h["Range"] = "bytes=0-15"
              t = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=30) as r:
                      head = r.read(80)
                      print(f"{label:24} {'range' if rng else 'plain'} -> {r.status} final={r.geturl()} "
                            f"ct={r.headers.get('Content-Type')} len={r.headers.get('Content-Length')} "
                            f"cr={r.headers.get('Content-Range')} ar={r.headers.get('Accept-Ranges')} "
                            f"head={head[:60]!r} {time.time()-t:.1f}s")
              except urllib.error.HTTPError as e:
                  body = e.read(200) if hasattr(e, "read") else b""
                  print(f"{label:24} {'range' if rng else 'plain'} -> HTTPError {e.code} "
                        f"ct={e.headers.get('Content-Type')} loc={e.headers.get('Location')} "
                        f"body={body[:120]!r} {time.time()-t:.1f}s")
              except Exception as e:
                  print(f"{label:24} {'range' if rng else 'plain'} -> {type(e).__name__}: {e} {time.time()-t:.1f}s")
          for label, url in urls.items():
              print(url)
              show(label, url, True)
              show(label, url, False)
              t = time.time()
              print(f"{label:24} probe() = {c.probe(url)} {time.time()-t:.1f}s\n")
          PY
      - name: download() on unposted files (what Oct 1 will hit)
        run: |
          python - <<'PY'
          import datetime as dt, time
          from amend import cycles as c
          c.DATA = "diag_data"
          D = dt.date
          for label, fn, d in (("csv 10-29", c.get_cycle, D(2026,10,29)),
                               ("air 10-29", c.get_airspace, D(2026,10,29)),
                               ("dtpp 2611", c.get_dtpp, D(2026,10,29))):
              t = time.time()
              try:
                  print(f"{label}: {fn(d)!r} ({time.time()-t:.1f}s)\n")
              except Exception as e:
                  print(f"{label}: RAISED {type(e).__name__}: {e} ({time.time()-t:.1f}s)\n")
          PY
      - name: download() + check_file on real posted files
        run: |
          python - <<'PY'
          import datetime as dt, os, time
          from amend import cycles as c
          c.DATA = "diag_data"
          D = dt.date
          for label, fn, d in (("csv 10-01", c.get_cycle, D(2026,10,1)),
                               ("csv 09-03", c.get_cycle, D(2026,9,3)),
                               ("dtpp 2610", c.get_dtpp, D(2026,10,1)),
                               ("dtpp 2609", c.get_dtpp, D(2026,9,3)),
                               ("air 10-01", c.get_airspace, D(2026,10,1)),
                               ("air 09-03", c.get_airspace, D(2026,9,3))):
              t = time.time()
              try:
                  r = fn(d)
                  print(f"{label}: {r!r} ({time.time()-t:.1f}s)")
              except Exception as e:
                  print(f"{label}: RAISED {type(e).__name__}: {e} ({time.time()-t:.1f}s)")
          for n in sorted(os.listdir("diag_data")):
              print(f"  {n} {os.path.getsize(os.path.join('diag_data', n)) / 1e6:.1f} MB")
          PY
      - name: what the scheduled check would decide right now
        run: |
          time python -m amend check
          python -c "import time; from amend.freshness import fingerprint as f; t=time.time(); print(f(), f'{time.time()-t:.1f}s')"
